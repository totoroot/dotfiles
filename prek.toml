# Configuration for `prek`, a Git hook manager written in Rust.
# See https://prek.j178.dev for details.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"
hooks = [
  { id = "gitleaks" },
]

[[repos]]
repo = "local"
hooks = [
  # Keep host evaluation separate. See bin/check-fleet.
  { id = "nix-parse", name = "Parse Nix files", entry = '''bash -c 'status=0; for file; do nix-instantiate --parse "./$file" >/dev/null || status=1; done; exit "$status"' --''', language = "system", types = ["nix"] },
  { id = "shellcheck", name = "ShellCheck (errors only)", entry = "shellcheck --severity=error --", language = "system", types_or = ["bash", "sh", "dash", "ksh"] },
]
